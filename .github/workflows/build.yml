
name: Build Drama3 Windows CUDA + WebUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout current audio.cpp
        uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: Initialize MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'

      - name: Verify compilers and CUDA smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          where.exe cl
          if ($LASTEXITCODE -ne 0) { throw 'cl.exe is unavailable' }
          nvcc --version
          if ($LASTEXITCODE -ne 0) { throw 'nvcc is unavailable' }
          if (-not $env:VSCMD_VER) { throw 'MSVC environment is missing' }
          if (-not (Test-Path 'docs/models/fish_drama3.md')) {
            throw 'Drama 3 files are not present in this checkout'
          }
          @'
          __global__ void test_kernel() {}
          int main() { return 0; }
          '@ | Set-Content -Path cuda_smoke.cu -Encoding ascii
          nvcc --use-local-env -arch=sm_120a -c cuda_smoke.cu -o cuda_smoke.obj
          if ($LASTEXITCODE -ne 0) { throw 'Standalone CUDA compile failed' }
          Write-Host 'Standalone CUDA compilation succeeded'

      - name: Remove explicit CUDA host compiler override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'scripts/build_windows.ps1'
          $lines = @(Get-Content -LiteralPath $scriptPath)
          $pattern = '^[ \t]*\$configureArgs[ \t]*\+=[ \t]*"-DCMAKE_CUDA_HOST_COMPILER='
          $found = @($lines | Where-Object { $_ -match $pattern })
          if ($found.Count -ne 1) {
            throw "Expected 1 CUDA host compiler override, found $($found.Count). Stop to inspect upstream changes."
          }
          $updated = @($lines | Where-Object { $_ -notmatch $pattern })
          Set-Content -LiteralPath $scriptPath -Value $updated -Encoding utf8
          Write-Host 'Removed the conflicting CMAKE_CUDA_HOST_COMPILER setting'

      - name: Prepare embedded WebUI assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build embedded browser UI
        shell: pwsh
        working-directory: webui/native
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'WebUI build failed' }
          if (-not (Test-Path 'dist/index.html')) { throw 'Embedded UI file was not produced' }

      - name: Configure and build Drama 3 CLI
        shell: pwsh
        env:
          NVCC_PREPEND_FLAGS: '--use-local-env'
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build_windows.ps1 `
            -NativeModelManager `
            -Preset windows-cuda-release `
            -ModelSet custom `
            -Models fish_drama3 `
            -Target audiocpp_cli `
            -CpuArch avx2 `
            -CudaArchitectures 120a-real `
            -Jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'audio.cpp build failed' }

      - name: Build Drama 3 WebUI server
        shell: pwsh
        env:
          NVCC_PREPEND_FLAGS: '--use-local-env'
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build_windows.ps1 `
            -NativeModelManager `
            -Preset windows-cuda-release `
            -ModelSet custom `
            -Models fish_drama3 `
            -Target audiocpp_server `
            -CpuArch avx2 `
            -CudaArchitectures 120a-real `
            -Jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'audio.cpp WebUI server build failed' }

      - name: Package the CLI, server and runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build/windows-cuda-release/bin'
          foreach ($exe in @('audiocpp_cli.exe', 'audiocpp_server.exe')) {
            if (-not (Test-Path (Join-Path $bin $exe))) {
              throw "$exe was not produced"
            }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Path "$bin/*" -Destination package -Recurse -Force
          Copy-Item -Path model_specs -Destination package/model_specs -Recurse -Force

          $cudaDirs = @((Join-Path $env:CUDA_PATH 'bin'), (Join-Path $env:CUDA_PATH 'bin/x64'))
          foreach ($dll in @('cublas64_13.dll', 'cublasLt64_13.dll', 'cufft64_12.dll')) {
            $source = @($cudaDirs | ForEach-Object { Join-Path $_ $dll } | Where-Object { Test-Path $_ }) | Select-Object -First 1
            if (-not $source) { throw "Missing CUDA runtime DLL: $dll" }
            Copy-Item -LiteralPath $source -Destination package -Force
          }

          $redistDirs = @()
          foreach ($vsRoot in @(
            'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC',
            'C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Redist/MSVC'
          )) {
            if (Test-Path $vsRoot) {
              foreach ($version in (Get-ChildItem $vsRoot -Directory)) {
                $redistDirs += (Join-Path $version.FullName 'x64/Microsoft.VC143.CRT')
                $redistDirs += (Join-Path $version.FullName 'x64/Microsoft.VC143.OpenMP')
              }
            }
          }

          $runtimeDirs = @((Join-Path $env:WINDIR 'System32')) + $redistDirs
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'vcomp140.dll')) {
            $source = @($runtimeDirs | ForEach-Object { Join-Path $_ $dll } | Where-Object { Test-Path $_ }) | Select-Object -First 1
            if (-not $source) { throw "Missing required MSVC/OpenMP DLL: $dll" }
            Copy-Item -LiteralPath $source -Destination package -Force
          }

          foreach ($dll in @('cudart64_13.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'msvcp140_atomic_wait.dll')) {
            $dirs = $runtimeDirs + $cudaDirs
            $source = @($dirs | ForEach-Object { Join-Path $_ $dll } | Where-Object { Test-Path $_ }) | Select-Object -First 1
            if ($source) { Copy-Item -LiteralPath $source -Destination package -Force }
          }

          @'
          @echo off
          cd /d "%~dp0"
          start "" "http://127.0.0.1:8080"
          "%~dp0audiocpp_server.exe" --ui --ui-management --backend cuda
          pause
          '@ | Set-Content -Path package/start_drama3_ui.bat -Encoding ascii

          Get-ChildItem package | Select-Object Name, Length

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drama3-Windows-RTX5060Ti-WebUI
          path: package/
          if-no-files-found: error
          retention-days: 7
